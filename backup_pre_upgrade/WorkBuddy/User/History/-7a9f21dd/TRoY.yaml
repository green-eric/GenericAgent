# A 股利好监控系统 - 数据获取配置
# 包含：数据获取器、外部API、K线获取器、速率限制

system:
  data_fetcher:
    batch_size: 30
    delay: 0.2
    max_fetch_time: 90
    max_retries: 3
    max_workers: 8
    news_circuit_breaker:
      failure_threshold: 5
      recovery_timeout: 15
    news_pages: 8
    timeout: 5
    news_quality:
      enable_quality_scoring: true
      enable_quality_sorting: true
      source_weight:
        ths: 1.0
        eastmoney: 0.9
        sina: 0.8
        cls_flash: 0.85
      keyword_bonus: 0.3
      stock_count_bonus: 0.2
      title_length_penalty: 0.1
    dynamic_api_priority:
      enable_dynamic_priority: true
      success_rate_weight: 0.4
      response_time_weight: 0.3
      news_count_weight: 0.3
      min_pages: 5
      max_pages: 15
    storage:
      enable_persistence: true
      persist_after_hours: 6
      db_path: data/news_cache.db

  external_api:
    kline_backup_url: https://money.finance.sina.com.cn/quotes_service/api/json_v2.php/CN_MarketData.getKLineData
    kline_url: https://web.ifzq.gtimg.cn/appstock/app/fqkline/get
    news_api_configs:
      eastmoney:
        enabled: true
        headers:
          Accept: application/json, text/javascript, */*
          Referer: https://kuaixun.eastmoney.com
          User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        name: eastmoney
        timeout: 10
        url: https://np-listapi.eastmoney.com/comm/web/getNewsByColumns
      sina:
        enabled: true
        headers:
          Accept: application/json, text/javascript, */*
          Referer: https://finance.sina.com.cn
          User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        name: sina
        timeout: 10
        url: https://feed.mix.sina.com.cn/api/roll/get
      ths:
        enabled: true
        headers:
          Accept: application/json, text/plain, */*
          Accept-Language: zh-CN,zh;q=0.9
          Connection: keep-alive
          Referer: https://news.10jqka.com.cn
          User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
            (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36
        name: ths
        timeout: 10
        url: https://news.10jqka.com.cn/tapp/news/push/stock/
      cls_flash:
        enabled: true
        headers:
          Referer: https://www.cls.cn
          User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        name: cls_flash
        timeout: 10
        url: https://www.cls.cn/nodeapi/telegraphList
    news_backup_urls:
    - https://np-anotice-stock.eastmoney.com/api/security/ann
    - https://feed.mix.sina.com.cn/api/roll/get
    news_url: https://news.10jqka.com.cn/tapp/news/push/stock/
    quote_backup_urls:
    - https://finance.sina.com.cn/realstock/company/
    - https://api.money.126.net/data/feed/
    quote_url: https://qt.gtimg.cn/q=

  # ===== K线获取器配置 =====
  # days: K线天数 | fq: 复权类型(qfq=前复权) | timeout: 总超时(秒)
  kline_fetcher:
    backup_api_timeout: 3.0
    days: 120
    fq: qfq
    max_retries: 3
    max_workers: 5
    primary_api_timeout: 3.0
    retry_backoff_factor: 1.0
    retry_max_wait: 5.0
    timeout: 5.0

  # ===== 速率限制配置 =====
  # rate: 每秒请求数 | capacity: 令牌桶容量
  rate_limiter:
    kline:
      capacity: 30
      rate: 15
    news:
      capacity: 50
      rate: 20
    quote:
      capacity: 60
      rate: 30
